[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyquistguard-tsc"
version = "0.1.0"
description = "Alias-aware sampling-rate-equivariant selective time-series classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "torch>=2.8",
  "PyYAML>=6.0",
  "aeon==1.3.0",
  "pyEDFlib==0.1.42",
  "wfdb==4.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA-capable PyTorch runtime",
  "slow: bounded synthetic optimization test",
]
