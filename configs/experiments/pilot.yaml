stage: pilot
protocol_version: pilot_v1
datasets: [basicmotions_uea, epilepsy_uea, pamap2_uci, mhealth_uci]
methods:
  - nyquistguard
  - fixed_rate_tcn
  - multirate_tcn
  - minirocket
  - no_nyquist_gate
  - no_cbe
  - no_selective_head
seeds: [17, 42, 2026]
train_rate_ratios: [1.0, 0.75, 0.5]
test_rate_ratios: [1.0, 0.9, 0.6, 0.4, 0.3]
epochs: 30
early_stopping_patience: 7
batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
gradient_clip_norm: 1.0
amp_initial_scale: 1024.0
amp_growth_interval: 2000
antialias_fir_taps: 31
antialias_rolloff: 0.90
num_workers: 0
minirocket_kernels: 10000
minirocket_jobs: 4
model:
  num_bands: 16
  pooled_positions: 32
  hidden_dim: 64
  encoder_depth: 3
  encoder_kernel_size: 5
  dropout: 0.05
  min_center_hz: 0.20
  min_sigma_seconds: 0.015
  max_sigma_seconds: 0.50
  kernel_support_sigmas: 4.0
  max_kernel_seconds: 1.0
  filterbank_type: physical
  discrete_kernel_size: 31
  use_nyquist_gate: true
  use_selective_head: true
  selective_hidden_dim: 64
  timestamp_relative_tolerance: 0.05
objective:
  lambda_cbe: 1.0
  lambda_selective: 1.0
  lambda_monotonicity: 0.1
  lambda_filter_regularization: 0.01
  target_coverage: 0.80
  coverage_weight: 5.0
  monotonicity_margin: 0.0
  equivariance_mode: common_band_equivariance
  common_band_mask: exact_min
  softmin_temperature: 0.05
  min_center_hz: 0.20
  min_sigma_seconds: 0.015
  max_sigma_seconds: 0.50
  regularization_minimum_spacing_fraction: 0.35
  regularization_spacing_weight: 1.0
  regularization_coverage_weight: 0.1
  regularization_bounds_weight: 1.0
  regularization_gate_weight: 0.1
  regularization_minimum_gate_softness: 0.01
baseline:
  hidden_dim: 64
  depth: 4
  kernel_size: 5
  dropout: 0.10
